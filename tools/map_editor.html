<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>2D Scene Mapper</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
}

#toolbar {
  padding: 8px;
  display: flex;
  gap: 8px;
  align-items: center;
}

#gridContainer {
  position: relative;
  margin: 10px;
  background-color: #000;
  background-size: 40px 40px;
  background-image:
    linear-gradient(to right, #fff 1px, transparent 1px),
    linear-gradient(to bottom, #fff 1px, transparent 1px);
}

.wall, .object {
  position: absolute;
  box-sizing: border-box;
  user-select: none;
}

.wall {
  background: gray;
}

.object svg {
  width: 100%;
  height: 100%;
}

.selected {
  outline: 3px solid yellow;
}

#ariaLive {
  position: absolute;
  left: -9999px;
}

#modalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
}

#modal {
  background: #111;
  padding: 16px;
  width: 380px;
  border: 2px solid #fff;
}

#modal label {
  display: block;
  margin-top: 8px;
}

textarea, input, select {
  width: 100%;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div id="toolbar">
  Map name:
  <input id="mapName" />
  Grid X:
  <input id="gridX" type="number" value="20" />
  Grid Y:
  <input id="gridY" type="number" value="20" />
  <button id="saveBtn">Save</button>
  <button id="loadBtn">Load</button>
  <button id="exportBtn">Export</button>
</div>

<div id="gridContainer"></div>
<div id="ariaLive" aria-live="polite"></div>

<div id="modalOverlay">
  <div id="modal"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modalTitle"
       tabindex="-1">
  </div>
</div>

<script type="module">
import { generateSceneJS } from "./sceneAdaptorCore.js";

const saveBtn = document.getElementById("saveBtn");
const loadBtn = document.getElementById("loadBtn");
const exportBtn = document.getElementById("exportBtn");

const mapName = document.getElementById("mapName");
const gridX = document.getElementById("gridX");
const gridY = document.getElementById("gridY");

const GRID_SIZE = 40;

const gridContainer = document.getElementById("gridContainer");
const modalOverlay = document.getElementById("modalOverlay");
const modal = document.getElementById("modal");
const ariaLive = document.getElementById("ariaLive");

let items = [];
let selectedItem = null;
let modalOpen = false;
let lastFocused = null;

/* ================= GRID ================= */

function updateGridSize() {
  gridContainer.style.width = Number(gridX.value) * GRID_SIZE + "px";
  gridContainer.style.height = Number(gridY.value) * GRID_SIZE + "px";
}

gridX.onchange = updateGridSize;
gridY.onchange = updateGridSize;
updateGridSize();

/* ================= SELECTION ================= */

function deselectAll() {
  items.forEach(i => i.el.classList.remove("selected"));
  selectedItem = null;
}

function selectItem(item) {
  deselectAll();
  selectedItem = item;
  item.el.classList.add("selected");

  ariaLive.textContent =
    `${item.type} ${item.name || "unnamed"} selected`;
}

/* ================= DELETE ================= */

function deleteSelectedItem() {
  if (!selectedItem || modalOpen) return;

  const idx = items.indexOf(selectedItem);
  if (idx === -1) return;

  selectedItem.el.remove();
  items.splice(idx, 1);

  ariaLive.textContent =
    `${selectedItem.type} ${selectedItem.name || "unnamed"} deleted`;

  selectedItem = null;
}

/* ================= ITEM CREATION ================= */

function attachItemHandlers(item) {
  item.el.onclick = () => selectItem(item);

  item.el.oncontextmenu = e => {
    e.preventDefault();
    selectItem(item);
    openEditModal(item);
  };
}

function createWall(x, y) {
  const el = document.createElement("div");
  el.className = "wall";

  const wall = {
    type: "wall",
    x, y,
    w: 1,
    h: 1,
    height: 3,
    color: "gray",
    name: "",
    notes: "",
    propertiesRaw: "",
    properties: {},
    el
  };

  attachItemHandlers(wall);
  gridContainer.appendChild(el);
  items.push(wall);
  updateItem(wall);
}

function createObject(x, y) {
  const el = document.createElement("div");
  el.className = "object";

  const obj = {
    type: "object",
    x, y,
    shape: "square",
    color: "cyan",
    name: "",
    notes: "",
    propertiesRaw: "",
    properties: {},
    el
  };

  attachItemHandlers(obj);
  gridContainer.appendChild(el);
  items.push(obj);
  renderObject(obj);
  updateItem(obj);
}

/* ================= RENDER ================= */

function renderObject(obj) {
  const svg = {
    square: `<rect x="5" y="5" width="30" height="30" fill="${obj.color}"/>`,
    circle: `<circle cx="20" cy="20" r="15" fill="${obj.color}"/>`
  };
  obj.el.innerHTML = `<svg viewBox="0 0 40 40">${svg[obj.shape]}</svg>`;
}

function updateItem(item) {
  item.el.style.left = item.x * GRID_SIZE + "px";
  item.el.style.top = item.y * GRID_SIZE + "px";

  if (item.type === "wall") {
    item.el.style.width = item.w * GRID_SIZE + "px";
    item.el.style.height = item.h * GRID_SIZE + "px";
    item.el.style.background = item.color;
  } else {
    item.el.style.width = GRID_SIZE + "px";
    item.el.style.height = GRID_SIZE + "px";
  }
}

/* ================= MODAL ================= */

function openEditModal(item) {
  if (!item) return;

  lastFocused = document.activeElement;
  modalOpen = true;
  modalOverlay.style.display = "flex";

  modal.innerHTML = `
    <h2 id="modalTitle">Edit ${item.type}</h2>

    <label>Name
      <input id="editName" value="${item.name}">
    </label>

    <label>Color
      <input id="editColor" value="${item.color}">
    </label>

    <label>Notes
      <textarea id="editNotes">${item.notes}</textarea>
    </label>

    <label>Properties (raw JSON)
      <textarea id="editProps" rows="6">${item.propertiesRaw || ""}</textarea>
    </label>

    <button id="applyBtn">Apply</button>
    <button id="closeBtn">Close</button>
  `;

  document.getElementById("applyBtn").onclick = () => {
    item.name = document.getElementById("editName").value;
    item.color = document.getElementById("editColor").value;
    item.notes = document.getElementById("editNotes").value;
    item.propertiesRaw = document.getElementById("editProps").value;

    if (item.type === "object") renderObject(item);
    updateItem(item);
    closeModal();
  };

  document.getElementById("closeBtn").onclick = closeModal;
  modal.focus();
}

function closeModal() {
  modalOverlay.style.display = "none";
  modalOpen = false;
  if (lastFocused) lastFocused.focus();
}

/* ================= KEYBOARD ================= */

document.addEventListener("keydown", e => {
  if ((e.key === "Delete" || e.key === "Backspace") && selectedItem) {
    deleteSelectedItem();
    e.preventDefault();
  }

  if ((e.key === "e" || e.key === "E") && !modalOpen && selectedItem) {
    openEditModal(selectedItem);
    e.preventDefault();
  }

  if (e.key === "Escape" && modalOpen) {
    closeModal();
    e.preventDefault();
  }
});

/* ================= SAVE / LOAD / EXPORT ================= */

saveBtn.onclick = () => {
  const data = {
    mapName: mapName.value,
    gridX: Number(gridX.value),
    gridY: Number(gridY.value),
    items: items.map(({ el, ...i }) => i)
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: "application/json"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "map.json";
  a.click();
};

loadBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";

  input.onchange = e => {
    const r = new FileReader();
    r.onload = () => {
      const d = JSON.parse(r.result);

      items.forEach(i => i.el.remove());
      items = [];
      selectedItem = null;

      mapName.value = d.mapName;
      gridX.value = d.gridX;
      gridY.value = d.gridY;
      updateGridSize();

      d.items.forEach(i => {
        i.type === "wall" ? createWall(i.x, i.y) : createObject(i.x, i.y);
        const item = items.at(-1);
        const el = item.el;
        Object.assign(item, i);
        item.el = el;
        attachItemHandlers(item);
        if (item.type === "object") renderObject(item);
        updateItem(item);
      });
    };
    r.readAsText(e.target.files[0]);
  };

  input.click();
};

exportBtn.onclick = () => {
  const mapData = {
    mapName: mapName.value || "unnamed_map",
    gridX: Number(gridX.value),
    gridY: Number(gridY.value),
    items: items.map(({ el, propertiesRaw, type, name, x, y, w, h, height, shape, color, notes }) => {
      let props = {};
      if (propertiesRaw && propertiesRaw.trim() !== "") {
        try {
          props = JSON.parse(propertiesRaw);
        } catch (e) {
          console.warn("Invalid JSON in propertiesRaw for", name, e);
        }
      }

      const id = name
        ? name.replace(/\s+/g, "_") + "_" + type
        : type + "_" + Math.floor(Math.random() * 1000);

      const position = {
        x,
        y: type === "wall" ? height / 2 : 0,
        z: y
      };

      const size =
        type === "wall"
          ? { x: w, y: height, z: h }
          : { x: 1, y: 1, z: 1 };

      return {
        id,
        type: type === "object" && props.type === "point" ? "light" : type,
        position,
        size,
        shape,
        color,
        notes,
        properties: props
      };
    })
  };

  const sceneJS = generateSceneJS(mapData);

  const blob = new Blob([sceneJS], {
    type: "application/javascript"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Scene_${mapData.mapName}.js`;
  a.click();
};
</script>

</body>
</html>
