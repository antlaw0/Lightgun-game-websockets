<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>2D Scene Mapper</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
}

#toolbar {
  padding: 8px;
  display: flex;
  gap: 8px;
  align-items: center;
}

#gridContainer {
  position: relative;
  margin: 10px;
  background-color: #000;
  background-size: 40px 40px;
  background-image:
    linear-gradient(to right, #fff 1px, transparent 1px),
    linear-gradient(to bottom, #fff 1px, transparent 1px);
}

.wall, .object, .tile {
  position: absolute;
  box-sizing: border-box;
  user-select: none;
}

.wall {
  background: gray;
}

.object svg {
  width: 100%;
  height: 100%;
}

.tile {
  border: 2px solid #888;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
}

.tile-content {
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tile-label {
  background: rgba(0, 0, 0, 0.7);
  padding: 2px 4px;
  border-radius: 2px;
}

.selected {
  outline: 3px solid yellow;
}

.transparent {
  opacity: 0.3;
}

#ariaLive {
  position: absolute;
  left: -9999px;
}

#modalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
}

#modal {
  background: #111;
  padding: 16px;
  width: 380px;
  border: 2px solid #fff;
}

#modal label {
  display: block;
  margin-top: 8px;
}

textarea, input, select {
  width: 100%;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div id="toolbar">
  Map name:
  <input id="mapName" />
  Grid X:
  <input id="gridX" type="number" value="20" />
  Grid Y:
  <input id="gridY" type="number" value="20" />
  <button id="saveBtn">Save</button>
  <button id="loadBtn">Load</button>
  <button id="exportBtn">Export</button>
  <span id="layerIndicator" style="margin-left: 20px; padding: 8px; background: #333; border: 1px solid #555;">
    Layer: <strong id="currentLayerName">middle</strong> (Page Up/Down to switch)
  </span>
</div>

<div id="gridContainer"></div>
<div id="ariaLive" aria-live="polite"></div>

<div id="modalOverlay">
  <div id="modal"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modalTitle"
       tabindex="-1">
  </div>
</div>

<script type="module">
import { generateSceneJS } from "./sceneAdaptorCore.js";

const saveBtn = document.getElementById("saveBtn");
const loadBtn = document.getElementById("loadBtn");
const exportBtn = document.getElementById("exportBtn");

const mapName = document.getElementById("mapName");
const gridX = document.getElementById("gridX");
const gridY = document.getElementById("gridY");
const currentLayerName = document.getElementById("currentLayerName");

const GRID_SIZE = 40;
const LAYERS = ["floor", "middle", "ceiling"];

const gridContainer = document.getElementById("gridContainer");
const modalOverlay = document.getElementById("modalOverlay");
const modal = document.getElementById("modal");
const ariaLive = document.getElementById("ariaLive");

let items = [];
let selectedItem = null;
let modalOpen = false;
let lastFocused = null;
let mouseGridX = 0;
let mouseGridY = 0;
let currentLayer = "middle"; // "floor", "middle", or "ceiling"

/* ================= LAYER MANAGEMENT ================= */

function setCurrentLayer(layer) {
  if (!LAYERS.includes(layer)) return;
  currentLayer = layer;
  currentLayerName.textContent = layer;
  deselectAll();
  updateLayerVisibility();
}

function updateLayerVisibility() {
  items.forEach(item => {
    if (item.layer === currentLayer) {
      item.el.classList.remove("transparent");
      item.el.style.opacity = "1";
      item.el.style.pointerEvents = "auto";
    } else if (item.layer === "middle" && currentLayer !== "middle") {
      item.el.classList.add("transparent");
      item.el.style.opacity = "0.3";
      item.el.style.pointerEvents = "none";
    } else {
      item.el.classList.remove("transparent");
      item.el.style.opacity = "0";
      item.el.style.pointerEvents = "none";
    }
  });
}

/* ================= GRID ================= */

function updateGridSize() {
  gridContainer.style.width = Number(gridX.value) * GRID_SIZE + "px";
  gridContainer.style.height = Number(gridY.value) * GRID_SIZE + "px";
}

gridX.onchange = updateGridSize;
gridY.onchange = updateGridSize;
updateGridSize();

/* ================= MOUSE TRACKING ================= */

gridContainer.addEventListener("mousemove", e => {
  const rect = gridContainer.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  mouseGridX = Math.floor(x / GRID_SIZE);
  mouseGridY = Math.floor(y / GRID_SIZE);
});

/* ================= SELECTION ================= */

function deselectAll() {
  items.forEach(i => i.el.classList.remove("selected"));
  selectedItem = null;
}

function selectItem(item) {
  // Can only select items on current layer
  if (item.layer !== currentLayer) {
    ariaLive.textContent = "Cannot select item on different layer";
    return;
  }
  
  deselectAll();
  selectedItem = item;
  item.el.classList.add("selected");

  ariaLive.textContent =
    `${item.type} ${item.name || "unnamed"} selected`;
}

/* ================= DELETE ================= */

function deleteSelectedItem() {
  if (!selectedItem || modalOpen) return;
  if (selectedItem.layer !== currentLayer) return;

  const idx = items.indexOf(selectedItem);
  if (idx === -1) return;

  selectedItem.el.remove();
  items.splice(idx, 1);

  ariaLive.textContent =
    `${selectedItem.type} ${selectedItem.name || "unnamed"} deleted`;

  selectedItem = null;
}

/* ================= ITEM CREATION ================= */

function attachItemHandlers(item) {
  item.el.onclick = () => selectItem(item);

  item.el.oncontextmenu = e => {
    e.preventDefault();
    selectItem(item);
    if (item.layer === currentLayer) {
      openEditModal(item);
    }
  };
}

function createObject(x, y) {
  const el = document.createElement("div");
  el.className = "object";

  const obj = {
    type: "object",
    x, y,
    w: 1,
    h: 1,
    height: currentLayer === "middle" ? 7 : 1,
    shape: "resizable",
    color: "cyan",
    name: "",
    notes: "",
    propertiesRaw: "",
    properties: {},
    layer: currentLayer,
    el
  };

  attachItemHandlers(obj);
  gridContainer.appendChild(el);
  items.push(obj);
  renderObject(obj);
  updateItem(obj);
}

function createTile(x, y) {
  const el = document.createElement("div");
  el.className = "tile";

  const isFloor = currentLayer === "floor";
  const defaultHeight = isFloor ? 0 : 6;

  const tile = {
    type: "tile",
    x, y,
    w: 1,
    h: 1,
    height: defaultHeight,
    shape: "resizable",
    color: "transparent",
    name: "",
    notes: "",
    texture: "",
    propertiesRaw: "",
    properties: {},
    layer: currentLayer,
    el
  };

  attachItemHandlers(tile);
  gridContainer.appendChild(el);
  items.push(tile);
  renderTile(tile);
  updateItem(tile);
}

/* ================= RENDER ================= */

function renderObject(obj) {
  const svg = {
    square: `<rect x="5" y="5" width="30" height="30" fill="${obj.color}"/>`,
    circle: `<circle cx="20" cy="20" r="15" fill="${obj.color}"/>`,
    star: `<polygon points="20,5 24,18 37,18 26,25 30,37 20,30 10,37 14,25 3,18 16,18" fill="${obj.color}"/>`,
  };
  obj.el.innerHTML = `<svg viewBox="0 0 40 40">${svg[obj.shape] || svg.square}</svg>`;
}

function renderTile(tile) {
  const bgImage = tile.texture ? `url('${tile.texture}')` : `linear-gradient(45deg, #666, #999)`;
  tile.el.innerHTML = `
    <div class="tile-content" style="background-image: ${bgImage}">
      ${tile.name ? `<span class="tile-label">${tile.name}</span>` : ""}
    </div>
  `;
}

function updateItem(item) {
  item.el.style.left = item.x * GRID_SIZE + "px";
  item.el.style.top = item.y * GRID_SIZE + "px";

  if (item.shape === "resizable") {
    item.el.style.width = item.w * GRID_SIZE + "px";
    item.el.style.height = item.h * GRID_SIZE + "px";
    if (item.type === "object") {
      item.el.style.background = item.color;
    }
  } else {
    item.el.style.width = GRID_SIZE + "px";
    item.el.style.height = GRID_SIZE + "px";
  }

  updateLayerVisibility();
}

/* ================= MODAL ================= */

function openEditModal(item) {
  if (!item) return;

  lastFocused = document.activeElement;
  modalOpen = true;
  modalOverlay.style.display = "flex";

  // Different modal content for tiles vs objects
  if (item.type === "tile") {
    modal.innerHTML = `
      <h2 id="modalTitle">Edit Tile (${item.layer})</h2>

      <label>Name
        <input id="editName" value="${item.name}">
      </label>

      <label>Texture Path (e.g., assets/textures/floor_01.png)
        <input id="editTexture" value="${item.texture}" placeholder="assets/textures/texture.png">
      </label>

      <label>Notes
        <textarea id="editNotes">${item.notes}</textarea>
      </label>

      <label>Height
        <input id="editHeight" type="number" value="${item.height}">
      </label>

      <label>Properties (raw JSON)
        <textarea id="editProps" rows="6">${item.propertiesRaw || ""}</textarea>
      </label>

      <button id="applyBtn">Apply</button>
      <button id="closeBtn">Close</button>
    `;

    document.getElementById("applyBtn").onclick = () => {
      item.name = document.getElementById("editName").value;
      item.texture = document.getElementById("editTexture").value;
      item.notes = document.getElementById("editNotes").value;
      item.height = Number(document.getElementById("editHeight").value);
      item.propertiesRaw = document.getElementById("editProps").value;

      renderTile(item);
      updateItem(item);
      closeModal();
    };
  } else {
    // Object modal (existing code)
    modal.innerHTML = `
      <h2 id="modalTitle">Edit ${item.type}</h2>

      <label>Name
        <input id="editName" value="${item.name}">
      </label>

      <label>Color
    <select id="editColor">
      <option value="yellow">yellow</option>
      <option value="white">white</option>
      <option value="blue">blue</option>
      <option value="red">red</option>
      <option value="orange">orange</option>
      <option value="black">black</option>
      <option value="magenta">magenta</option>
      <option value="green">green</option>
    </select>
  </label>

      <label>Shape
        <select id="editShape">
          <option value="resizable">resizable</option>
          <option value="circle">circle</option>
          <option value="star">star</option>
        </select>
      </label>

      <label>Notes
        <textarea id="editNotes">${item.notes}</textarea>
      </label>

      <label>Height
        <input id="editHeight" type="number" value="${item.height}">
      </label>

      <label>Properties (raw JSON)
        <textarea id="editProps" rows="6">${item.propertiesRaw || ""}</textarea>
      </label>

      <button id="applyBtn">Apply</button>
      <button id="closeBtn">Close</button>
    `;

    document.getElementById("editShape").value = item.shape || "resizable";

    document.getElementById("applyBtn").onclick = () => {
      item.name = document.getElementById("editName").value;
      item.color = document.getElementById("editColor").value;
      item.notes = document.getElementById("editNotes").value;
      item.height = Number(document.getElementById("editHeight").value);
      item.propertiesRaw = document.getElementById("editProps").value;
      item.shape = document.getElementById("editShape").value;

      renderObject(item);
      updateItem(item);
      closeModal();
    };
  }

  document.getElementById("closeBtn").onclick = closeModal;
  modal.focus();
}

function closeModal() {
  modalOverlay.style.display = "none";
  modalOpen = false;
  if (lastFocused) lastFocused.focus();
}

/* ================= KEYBOARD ================= */

document.addEventListener("keydown", e => {
  // Layer switching
  if (e.key === "PageUp") {
    const idx = LAYERS.indexOf(currentLayer);
    const newIdx = (idx - 1 + LAYERS.length) % LAYERS.length;
    setCurrentLayer(LAYERS[newIdx]);
    ariaLive.textContent = `Switched to ${LAYERS[newIdx]} layer`;
    e.preventDefault();
  }

  if (e.key === "PageDown") {
    const idx = LAYERS.indexOf(currentLayer);
    const newIdx = (idx + 1) % LAYERS.length;
    setCurrentLayer(LAYERS[newIdx]);
    ariaLive.textContent = `Switched to ${LAYERS[newIdx]} layer`;
    e.preventDefault();
  }

  if ((e.key === "Delete" || e.key === "Backspace") && selectedItem) {
    deleteSelectedItem();
    e.preventDefault();
  }

  if ((e.key === "e" || e.key === "E") && !modalOpen && selectedItem) {
    openEditModal(selectedItem);
    e.preventDefault();
  }

  if (e.key === "Escape" && modalOpen) {
    closeModal();
    e.preventDefault();
  }

  /* ================= MOVE / RESIZE ================= */

// Spawn object / tile with 1 key
if (e.key === "1" && !modalOpen) {
  if (currentLayer === "middle") {
    createObject(mouseGridX, mouseGridY);
    ariaLive.textContent = "Object created on middle layer";
  } else {
    createTile(mouseGridX, mouseGridY);
    ariaLive.textContent = `${currentLayer} tile created`;
  }
  e.preventDefault();
  return;
}

/* ================= MOVE / RESIZE ================= */

// From this point on, we REQUIRE a selection
if (!selectedItem || selectedItem.layer !== currentLayer) return;

// Arrow keys move
switch (e.key) {
  case "ArrowUp":
    selectedItem.y = Math.max(0, selectedItem.y - 1);
    updateItem(selectedItem);
    e.preventDefault();
    break;
  case "ArrowDown":
    selectedItem.y += 1;
    updateItem(selectedItem);
    e.preventDefault();
    break;
  case "ArrowLeft":
    selectedItem.x = Math.max(0, selectedItem.x - 1);
    updateItem(selectedItem);
    e.preventDefault();
    break;
  case "ArrowRight":
    selectedItem.x += 1;
    updateItem(selectedItem);
    e.preventDefault();
    break;
}

// Numpad resize
if (selectedItem.shape === "resizable") {
  switch (e.code) {
    case "Numpad8":
      selectedItem.h += 1;
      updateItem(selectedItem);
      e.preventDefault();
      break;
    case "Numpad2":
      selectedItem.h = Math.max(1, selectedItem.h - 1);
      updateItem(selectedItem);
      e.preventDefault();
      break;
    case "Numpad6":
      selectedItem.w += 1;
      updateItem(selectedItem);
      e.preventDefault();
      break;
    case "Numpad4":
      selectedItem.w = Math.max(1, selectedItem.w - 1);
      updateItem(selectedItem);
      e.preventDefault();
      break;
  }
}
});

/* ================= SAVE / LOAD / EXPORT ================= */

saveBtn.onclick = () => {
  const data = {
    mapName: mapName.value,
    gridX: Number(gridX.value),
    gridY: Number(gridY.value),
    items: items.map(({ el, ...i }) => i)
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: "application/json"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "map.json";
  a.click();
};

loadBtn.onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";

  input.onchange = e => {
    const r = new FileReader();
    r.onload = () => {
      const d = JSON.parse(r.result);

      items.forEach(i => i.el.remove());
      items = [];
      selectedItem = null;

      mapName.value = d.mapName;
      gridX.value = d.gridX;
      gridY.value = d.gridY;
      updateGridSize();

      d.items.forEach(i => {
        if (i.type === "tile") {
          // Create tile
          const el = document.createElement("div");
          el.className = "tile";
          const tile = {
            ...i,
            el
          };
          attachItemHandlers(tile);
          gridContainer.appendChild(el);
          items.push(tile);
          renderTile(tile);
          updateItem(tile);
        } else {
          // Create object
          createObject(i.x, i.y);
          const item = items.at(-1);
          const el = item.el;
          Object.assign(item, i);
          item.el = el;
          attachItemHandlers(item);
          renderObject(item);
          updateItem(item);
        }
      });

      updateLayerVisibility();
    };
    r.readAsText(e.target.files[0]);
  };

  input.click();
};

exportBtn.onclick = () => {
  const mapData = {
    mapName: mapName.value || "unnamed_map",
    gridX: Number(gridX.value),
    gridY: Number(gridY.value),
    items: items.map(({ el, propertiesRaw, type, name, x, y, w, h, height, shape, color, notes, texture, layer }) => {
      let props = {};
      if (propertiesRaw && propertiesRaw.trim() !== "") {
        try {
          props = JSON.parse(propertiesRaw);
        } catch (e) {
          console.warn("Invalid JSON in propertiesRaw for", name, e);
        }
      }

      const id = name
        ? name.replace(/\s+/g, "_") + "_" + type
        : type + "_" + Math.floor(Math.random() * 1000);

      // Store grid coordinates as-is
      let position, size;
      position = { x, y, z: y };
      size = { x: w, y: h, z: 1 };

      return {
        id,
        type: type === "object" && props.type === "point" ? "light" : type,
        layer,
        position,
        size,
        shape,
        color,
        texture,
        notes,
        properties: props
      };
    })
  };

  const sceneJS = generateSceneJS(mapData);

  const blob = new Blob([sceneJS], {
    type: "application/javascript"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Scene_${mapData.mapName}.js`;
  a.click();
};
</script>

</body>
</html>
