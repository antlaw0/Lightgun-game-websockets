<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lightgun - Controller (Phone)</title>
<style>
  html,body { height:100%; margin:0; font-family:Arial,Helvetica,sans-serif; background:#0b1220; color:#fff; display:flex; align-items:center; justify-content:center; }
  .panel { width:100%; max-width:520px; padding:12px; box-sizing:border-box; }
  .btn { display:inline-block; margin:6px 6px 6px 0; padding:12px 16px; border-radius:8px; background:#1b6; color:#002; font-weight:700; border:none; font-size:16px; }
  .btn.secondary { background:#4b6; color:#001; }
  .btn.warn { width:  200px; height:  150px; background:#f66; color:#200; }
  #debug { margin-top:12px; background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; font-size:13px; white-space:pre-wrap; min-height:80px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="panel" role="main">
  <h2>Controller (Phone)</h2>
  <div class="row">
    <button id="enableBtn" class="btn">Enable Orientation</button>
    <button id="calBtn" class="btn secondary">Calibrate</button>
    <button id="fireBtn" class="btn warn">Fire</button>
    <button id="reloadBtn" class="btn secondary">Reload</button>
  </div>
  <div id="debug" >Debug info will appear here</div>
</div>

<script src="js/controller.js"></script>
</body>
</html>
