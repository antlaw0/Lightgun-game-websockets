<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lightgun - 3D Shooting Gallery</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    height: 100%;
    width: 100%;
    overflow: hidden;
}

canvas { 
  width: 100%; 
  height: 100%; 
  display: block; 
  background: black;
}

#hud {
    position: fixed;
    left: 8px;
    top: 8px;
    background: rgba(0,0,0,0.6);
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.4;
}

#debugConsole {
    position: fixed;
    right: 8px;
    top: 8px;
    width: 320px;
    max-height: 60vh;
    overflow: auto;
    background: rgba(0,0,0,0.6);
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
}

#reticle {
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid lime;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="reticle"></div>
<div id="hud">
  <div><strong>Lightgun - 3D</strong></div>
  <div id="connStatus">WS: disconnected</div>
  <div>Reticle: <span id="retXY">0,0</span></div>
  <div>alpha/beta/gamma: <span id="abc">-, -, -</span></div>
  <div><small>Mouse click or fire button to shoot, hold 'Shift' to duck, 'Z' to zoom</small></div>
</div>
<div id="debugConsole" aria-live="polite"></div>

<script src="js/three.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
