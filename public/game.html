<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lightgun - 3D Shooting Gallery</title>
<style>
.hud-camera-debug {
  position: fixed;
  top: 80px;
  left: 10px;
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.75);
  color: #00ffcc;
  font-family: monospace;
  font-size: 12px;
  line-height: 1.4;
  z-index: 9999;
  pointer-events: none;
  white-space: pre;
}

html, body {
    margin: 0;
    padding: 0;
    background: black;
    height: 100%;
    width: 100%;
    overflow: hidden;
}

canvas { 
  width: 100%; 
  height: 100%; 
  display: block; 
  background: black;
}

#hud {
    position: fixed;
    left: 8px;
    top: 8px;
    background: rgba(0,0,0,0.6);
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.4;
}

#debugConsole {
    position: fixed;
    right: 8px;
    top: 8px;
    width: 320px;
    max-height: 60vh;
    overflow: auto;
    background: rgba(0,0,0,0.6);
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
}

/* Reticle sizes and styles */
:root {
  --reticle-size: 24px;       /* circle diameter */
  --reticle-border: 2px;      /* circle outline thickness */
  --cross-color: lime;
  --cross-thickness: 3px;
  --cross-length: 10vw;       /* length of lines extending from center */
}

/* Circle centered on the crosshair point */
#reticle {
    position: absolute;
    width: var(--reticle-size);
    height: var(--reticle-size);
    border: var(--reticle-border) solid var(--cross-color);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
}

/* Crosshair lines: both originate exactly at center */
#reticle::before,
#reticle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    pointer-events: none;
    background: var(--cross-color);
    z-index: 9998;
    transform: translate(-50%, -50%);
}

/* Horizontal line */
#reticle::before {
    width: var(--cross-length);
    height: var(--cross-thickness);
}

/* Vertical line */
#reticle::after {
    height: var(--cross-length);
    width: var(--cross-thickness);
}


/* ----------------- Health bar (centered bottom, half screen) ----------------- */
.hud-health {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  width: 50vw; /* half width of screen */
  max-width: 720px;
  min-width: 280px;
  height: 36px;
  background: rgba(0,0,0,0.5);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  box-sizing: border-box;
  padding: 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.hud-health .health-track {
  flex: 1;
  height: 100%;
  background: rgba(255,255,255,0.06);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}

.hud-health .health-fill {
  height: 100%;
  width: 100%;
  transition: width 250ms linear, background-color 200ms linear;
  display: block;
  border-radius: 12px;
  box-shadow: inset 0 -4px 10px rgba(0,0,0,0.3);
  background: linear-gradient(90deg, #4caf50, #3ea34f); /* start green */
}

.hud-health .health-text {
  min-width: 98px;
  text-align: right;
  font-size: 14px;
  font-weight: 600;
  padding-right: 8px;
}



.hud-weapon {
  position: fixed;
  left: 8px;          /* distance from left screen edge */
  bottom: 28px;       /* aligns with health bar bottom */
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* align text left */
  gap: 4px;
  font-size: 14px;
  color: white;
  z-index: 1000;      /* make sure it's above canvas */
}
.hud-weapon .weapon-image img {
  width: 64px;
  height: 64px;
}

/* Ngrok QR overlay */
#ngrokQR {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 160px;
  height: 160px;
  background: rgba(0,0,0,0.6);
  padding: 6px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 10000;
}
#ngrokQR img { width: 140px; height: 140px; display:block; }
#ngrokQR .ngrok-url { font-size: 11px; color: #fff; word-break: break-all; text-align:center; max-width:140px; }

</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="reticle"></div>

<div id="hud">
  <div><strong>Lightgun - 3D</strong></div>
  <div id="connStatus">WS: disconnected</div>
  <div>Reticle: <span id="retXY">0,0</span></div>
  <div>alpha/beta/gamma: <span id="abc">-, -, -</span></div>
  <div><small>Mouse click or fire button to shoot, hold 'Shift' to duck, 'Z' to zoom</small></div>
</div>

<div id="debugConsole" aria-live="polite"></div>

<!-- HUD Overlay -->
<div class="hud-container" aria-hidden="false">
  <!-- Health (center bottom) -->
  <div class="hud-health" role="status" aria-label="Player health" aria-live="polite">
    <div class="health-track" aria-hidden="true">
      <div class="health-fill hp-green" style="width:100%"></div>
    </div>
    <div class="health-text" aria-hidden="true">100 / 100</div>
  </div>

  <!-- Weapon info (bottom-right) -->
<div class="hud-weapon" role="status" aria-label="Weapon information" aria-live="polite" >

  <!-- Weapon Image -->
  <div class="weapon-image">
    <img style="width: 64px; height: 64px;" src="/assets/hud/weapon_placeholder.png" alt="weapon">
  </div>

  <!-- Weapon Name -->
  <div class="weapon-name" style="font-size: 14px; color: white; text-align: center;">
    Starter Pistol
  </div>

  <!-- Ammo Info -->
  <div class="weapon-meta" style="display: flex; flex-direction: row; align-items: center; gap: 4px; font-size: 14px; color: white;">
    <div class="ammo-row" style="display: flex; align-items: center; gap: 2px;">
      <span class="bullet-icon">
        <img style="width: 24px; height: 24px;" src="/assets/hud/bullet_placeholder.png" alt="bullets">
      </span>
      <span class="ammo-count">12 / 12</span>
      <span style="opacity:0.7;">|</span>
      <span class="total-ammo">48</span>
    </div>
  </div>

</div>

  <!-- Screen-reader urgent announcements -->
  <div id="hud-announce" role="alert" aria-live="assertive"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
  }
}
</script>


<!-- Your game code (game.js is ES module if it uses imports) -->
<script type="module" src="./js/game.js"></script>

<script>
// Poll for ngrok URL file and render a QR code for controller.html
(() => {
  const container = document.createElement('div');
  container.id = 'ngrokQR';
  container.style.display = 'none';
  container.innerHTML = '<div id="qrCanvas"></div><div class="ngrok-url" id="ngrokUrlText"></div>';
  document.body.appendChild(container);

  // Load QR lib if needed, then render QR into #qrCanvas
  function ensureQrLib() {
    return new Promise((resolve, reject) => {
      if (window.QRCode) return resolve();
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Failed to load QR lib'));
      document.head.appendChild(s);
    });
  }

  async function updateQr() {
    try {
      const r = await fetch('/ngrok_url.txt', { cache: 'no-store' });
      if (!r.ok) { container.style.display = 'none'; return; }
      const text = (await r.text()).trim();
      if (!text) { container.style.display = 'none'; return; }
      const base = text.replace(/\/+$/, '');
      const ctrl = base + '/controller.html';

      await ensureQrLib();
      const canvasHost = document.getElementById('qrCanvas');
      // clear previous
      canvasHost.innerHTML = '';
      new QRCode(canvasHost, { text: ctrl, width: 140, height: 140 });
      const txt = document.getElementById('ngrokUrlText');
      txt.textContent = ctrl;
      container.style.display = 'flex';
      canvasHost.onclick = () => { window.open(ctrl, '_blank'); };
    } catch (e) {
      container.style.display = 'none';
      console.warn('QR update failed', e);
    }
  }

  updateQr();
  setInterval(updateQr, 3000);
})();
</script>


</body>
</html>
