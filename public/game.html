<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lightgun - Game (PC)</title>
<style>


    html, body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }



  #canvas { width:100%; height:100%; display:block; background:#222; }
  #hud { position:fixed; left:8px; top:8px; background:rgba(0,0,0,0.6); padding:8px; border-radius:6px; font-size:13px; line-height:1.4; }
  #debugConsole { position:fixed; right:8px; top:8px; width:320px; max-height:60vh; overflow:auto; background:rgba(0,0,0,0.6); padding:8px; border-radius:6px; font-size:12px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div><strong>Lightgun - Game</strong></div>
  <div id="connStatus">WS: disconnected</div>
  <div>Reticle: <span id="retXY">0,0</span></div>
  <div>alpha/beta/gamma: <span id="abc">-, -, -</span></div>
  <div><small>Press mouse to simulate fire (for testing)</small></div>
</div>
<div id="debugConsole" aria-live="polite"></div>

<script src="js/game.js"></script>
</body>
</html>
